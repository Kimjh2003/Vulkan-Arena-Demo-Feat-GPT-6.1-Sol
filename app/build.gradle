plugins {
    id 'com.android.application'
}
android {
    namespace 'dev.demo.arena'
    compileSdk 37
    ndkVersion '30.0.15729638'
    defaultConfig {
        applicationId 'dev.demo.arena'
        minSdk 28
        targetSdk 37
        versionCode 1
        versionName '0.1'
        testInstrumentationRunner 'dev.demo.arena.ControlsInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra' } }
    }
    buildTypes {
        release {
            optimization { enable = true }
        }
        benchmark {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            debuggable false
        }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '4.1.2' } }
}
